<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات زِر الواتساب</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #111827;
            font-size: 22px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #10b981;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        button {
            width: 100%;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #059669;
        }

        .alert-success {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>إعدادات زِر الواتساب</h2>

        <div class="form-group">
            <label for="whatsappNumber">رقم الواتساب:</label>
            <input type="text" id="whatsappNumber" placeholder="966500000000">
        </div>

        <div class="form-group">
            <label for="customMessage">الرسالة المخصصة:</label>
            <textarea id="customMessage" placeholder="أهلاً، أود الاستفسار عن توفر هذا المنتج..."></textarea>
        </div>

        <button onclick="saveSettings()">حفظ البيانات</button>

        <div id="successAlert" class="alert-success">
            تم حفظ البيانات بنجاح، يمكنك إغلاق الصفحة الان
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const merchantId = urlParams.get('merchant_id') || '';

        if (merchantId) {
            fetch(`/api/settings?merchant_id=${merchantId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.whatsappNumber) document.getElementById('whatsappNumber').value = data.whatsappNumber;
                    if (data.customMessage) document.getElementById('customMessage').value = data.customMessage;
                })
                .catch(err => console.error('خطأ في جلب البيانات:', err));
        }

        function saveSettings() {
            const whatsappNumber = document.getElementById('whatsappNumber').value;
            const customMessage = document.getElementById('customMessage').value;

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    merchant_id: merchantId,
                    whatsappNumber: whatsappNumber,
                    customMessage: customMessage
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const alertBox = document.getElementById('successAlert');
                    alertBox.style.display = 'block';
                } else {
                    alert('حدث خطأ أثناء حفظ البيانات.');
                }
            })
            .catch(err => {
                alert('تعذر الاتصال بالسيرفر.');
            });
        }
    </script>

</body>
</html>
